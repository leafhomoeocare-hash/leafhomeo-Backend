name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            
            # Navigate to project folder (creates directory if it doesn't exist)
            TARGET_DIR=$(eval echo ~$USER)/leafhomeo-Backend
            if [ ! -d "$TARGET_DIR" ]; then
              TARGET_DIR="/root/leafhomeo-Backend"
            fi
            cd "$TARGET_DIR"

            # Pull latest changes
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies using node path directly
            npm ci --omit=dev

            # Reload PM2 application
            pm2 restart leafhomeo-api --update-env || pm2 start npm --name "leafhomeo-api" -- start
            pm2 save